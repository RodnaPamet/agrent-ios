# XcodeGen spec — generates Agrent.xcodeproj from this file.
#
#   brew install xcodegen
#   xcodegen generate
#   open Agrent.xcodeproj
#
# The .xcodeproj is NOT committed (see .gitignore): it is derived, and a
# generated pbxproj is the kind of file that produces conflicts nobody can
# read. This spec is the source of truth instead.
#
# Three values here MUST agree with Config.swift and the server, or sign-in
# fails with `redirect_uri_not_allowed`:
#   • CFBundleURLSchemes      bg.agrent.app   ← here
#   • Config.redirectScheme   bg.agrent.app   ← Agrent/Config.swift
#   • NATIVE_AUTH_REDIRECT_ALLOWLIST on the server (set 2026-09-17)
name: Agrent

options:
  bundleIdPrefix: bg.agrent
  deploymentTarget:
    iOS: "17.0"          # @Observable, @Environment(_.self),
                         # MainActor.assumeIsolated, ContentUnavailableView
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode on purpose. `presentationAnchor` is declared
    # nonisolated and calls MainActor.assumeIsolated (AuthClient.swift:132);
    # Swift 6 strict concurrency may reject that shape. Move to 6 once the
    # thing compiles and runs, not before.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Agrent:
    type: application
    platform: iOS
    sources:
      - path: Agrent
      # THE RECORDED PAYLOADS, INTO THE APP — in Debug only.
      #
      # `FixtureURLProtocol` answers the app's own requests from these files
      # when the app is launched with `AGRENT_UITEST_FIXTURES`, which is how a
      # UI test reaches a screen on a runner whose simulator has never signed
      # in. Read `Agrent/Debug/UITestSeam.swift` before moving this.
      #
      # POINTED AT `Tests/Fixtures` RATHER THAN COPIED. One set of bytes, read
      # by the unit suite and by the seam, so a fixture cannot be corrected in
      # one place and stay wrong in the other. `README.md` is excluded because
      # it is documentation, not a payload.
      #
      # Both this and `Agrent/Debug` are struck out of Release by
      # `EXCLUDED_SOURCE_FILE_NAMES` below, and the CI step "The UI test seam
      # cannot reach Release" checks the produced Release binary and bundle
      # rather than trusting this file.
      - path: Tests/Fixtures
        buildPhase: resources
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bg.agrent.app
        PRODUCT_NAME: Agrent
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signing is left unset deliberately: the simulator needs none, and
        # a device build wants YOUR team rather than a value committed here.
        # Xcode → Signing & Capabilities → Team, then it persists locally.
        CODE_SIGN_STYLE: Automatic
      configs:
        # TWO MECHANISMS FOR ONE GUARANTEE, because they fail differently.
        #
        # Every file under `Agrent/Debug` is also wrapped in `#if DEBUG`. A
        # `#if` is defeated by a configuration that defines DEBUG and is not
        # called Debug; a build-setting exclusion is defeated by a seam file
        # written outside this directory. Neither mistake is exotic, and the
        # cost of holding both is two lines.
        #
        # Release is `archive` and `profile` for the `Agrent` scheme, so this
        # is the configuration a build that could reach a phone uses.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(SRCROOT)/Agrent/Debug/* $(SRCROOT)/Tests/Fixtures/*"
    info:
      path: Agrent/Info.plist
      properties:
        CFBundleDisplayName: Agrent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The callback scheme. ASWebAuthenticationSession intercepts it, and
        # Config.swift's header requires it registered here too.
        CFBundleURLTypes:
          - CFBundleURLName: bg.agrent.app
            CFBundleURLSchemes:
              - bg.agrent.app

  # The app shipped with NO tests at all. Two bugs this week were decode
  # failures that a decode test would have caught before a device did:
  # LogEntryType shipped six cases against the server's ten, and the
  # calculator payload cannot be exercised in production because the tenant
  # has no grain data. Both are testable without a server.
  AgrentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Agrent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # A UI TEST TARGET, WHICH #97 ASSUMED COULD NOT EXIST HERE.
  #
  # The issue's reason for a 20-item manual checklist is that "the simulator
  # cannot be driven from this machine (no assistive access, no `simctl` input
  # verb)". Both are true; neither covers XCUITest, which drives the app from a
  # second process over the accessibility server. It taps, it navigates, and it
  # photographs — see `A11yShots/A11yShotsTests.swift` for what that does and
  # does not answer.
  #
  # It is NOT part of the `Agrent` scheme, and that is the whole reason the
  # `schemes:` block below exists — read it before moving this.
  AgrentA11yShots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: A11yShots
    dependencies:
      - target: Agrent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

# SCHEMES ARE SPELLED OUT HERE BECAUSE THE UI TESTS MUST NOT RUN ON CI.
#
# Nothing declared them before, so Xcode auto-created one scheme named after
# the app and folded every test bundle that depends on it into that scheme's
# test action. CI runs `xcodebuild test -scheme Agrent` (.github/workflows/
# ci.yml). Adding a UI test target with no schemes declared would therefore
# have added it to CI silently — and it would fail there for a reason that has
# nothing to do with the code under test: a GitHub runner's simulator is new
# every run, its Keychain is empty, so the app opens on `SignInView` and the
# suite cannot reach a single screen behind auth.
#
# So: `Agrent` keeps doing exactly what it did — build the app, run
# `AgrentTests` — and the screenshots live in a scheme of their own that only
# ever runs when somebody asks for it by name.
#
# SINCE agrent-ios#115 THE REASON ABOVE NO LONGER HOLDS, and the split stays
# anyway. The suite launches through the fixture seam, so an empty Keychain
# no longer stops it. What still keeps it off CI: it runs four times per
# `scripts/a11y-shots.sh` with the device's settings changed between runs,
# which `xcodebuild test -scheme Agrent` cannot express, and its output is
# photographs for a human to look at, not a pass/fail anyone has asked CI to
# gate on. Putting it on CI is a separate decision, not a side effect.
schemes:
  Agrent:
    build:
      targets:
        Agrent: all
    test:
      config: Debug
      targets:
        - AgrentTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgrentA11yShots:
    build:
      targets:
        Agrent: [run, test]
        AgrentA11yShots: [test]
    test:
      config: Debug
      targets:
        - AgrentA11yShots
    run:
      config: Debug
