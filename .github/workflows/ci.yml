name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded PULL REQUEST runs — a superseded one tells you nothing,
# and macOS minutes are the expensive kind.
#
# NEVER cancel a master run. With cancel-in-progress on every event, two
# merges in quick succession cancel the first one's verification, and the
# commit that just landed is never checked. That happened: the master run for
# 98138df (the Борса screen) was cancelled by the next merge, and it went onto
# master unverified.
#
# Nothing was broken by it — later master runs are green and contain that
# commit — but "a green master run exists somewhere after this" is a weaker
# claim than "this commit was checked", and it is the wrong one to rely on
# when bisecting. It also means a genuine break can land and be silently
# skipped if the next merge is fast enough.
#
# This matters more here than usual because merges are --rebase: the commit
# that lands on master is NOT the commit CI tested on the branch. The
# post-merge master run is the only thing that ever sees what actually landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A GitHub PAT was pasted into ROADMAP.md during development. It was
      # caught before it was committed, but only because someone looked. This
      # repo is PUBLIC, so a committed credential is a published one.
      - name: No credentials in the tree
        run: |
          if grep -rInE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}' \
               --exclude-dir=.git . ; then
            echo "::error::A GitHub token appears to be committed."
            exit 1
          fi
          if grep -rInE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.' --exclude-dir=.git . ; then
            echo "::error::Something JWT-shaped is committed — an access token?"
            exit 1
          fi
          echo "No credential-shaped strings found."

      # Measured on the device: this phone's AppleLocale is en_BG — English
      # language, Bulgarian region, an ordinary thing for a person to set.
      # On it, `Date.formatted` returns "11 September 2026" while SwiftUI's
      # `Text(date, format:)` two tabs away returns "21 септември". The app
      # had both, so one screen printed English under a Bulgarian label, and
      # a journal row's ACCESSIBILITY text said "September" while the screen
      # said "септември" — invisible to everyone who can see the screen.
      #
      # This app is Bulgarian-only, so dates are Bulgarian by declaration,
      # not by whatever the device happens to report. One idiom: BgDate.
      - name: Dates go through BgDate
        run: |
          hits=$(grep -rn --include='*.swift' \
                   -e '\.formatted(\.dateTime' \
                   -e ', format: \.dateTime' \
                   Agrent/ | grep -v 'Agrent/Design/BgDate.swift' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Format dates with BgDate, not Locale.current — see BgDate.swift."
            exit 1
          fi
          echo "All date formatting goes through BgDate."

      # The same bug as the step above, in the one place a spelling-based
      # check structurally cannot see it. Табло's task chart printed ENGLISH
      # month names until #93, and the whole defect was one line:
      #
      #   .chartXAxis { AxisMarks(values: .automatic(desiredCount: 3)) }
      #
      # A bare `AxisMarks` over a `Date` lets Swift Charts format from the
      # locale, this phone reports en_BG, and the dashboard read "Sep 14"
      # under a Bulgarian heading.
      #
      # Neither guard already here could catch it. `Dates go through BgDate`
      # rejects two SPELLINGS and there was no spelling to reject — the defect
      # is the ABSENCE of a format. A file-level check in the `CommodityName`
      # style would not fire either: DashboardView.swift already held three
      # other BgDate calls the whole time that chart printed English.
      #
      # So the unit has to be the axis BLOCK, which is why this is python and
      # not grep. A fixed `grep -A N` cannot be tuned: the correct block is 14
      # lines from `{` to its label, and 23 lines reaches the `.chartYAxis`
      # BELOW it, whose label would satisfy the check. Both ends move when
      # somebody edits a comment. Brace matching has no window.
      #
      # Inspecting 0 blocks FAILS. A guard keyed on a string stops guarding
      # the moment the string changes and reports success while it does. The
      # docstrings below carry the three narrower traps, each of which was a
      # defect in this step before it was a comment in it.
      #
      # Measured by extracting this script and running it per tree: fires on
      # f5b15f9 and 523598e, the two commits before #93; passes with 2 blocks
      # inspected on bf0e5a5 (#93 itself) and on 194189b (master).
      - name: Chart date axes label through BgDate
        run: |
          python3 --version
          python3 - <<'GUARD'
          import pathlib, re, sys

          # Anchored to `x:`. Unanchored, a chart with dates on the Y axis had
          # its correctly-bare numeric X axis reported as a defect.
          KEY = re.compile(r'x:\s*\.value\("\u0414\u0430\u0442\u0430"')

          def scan(text):
              """(code, tokens, delta) for one line.

              code   — // comment cut off, string literals intact, so KEY can
                       still see the label it is looking for.
              tokens — the same with string CONTENTS blanked. Every token
                       search below runs on this, so no literal can satisfy or
                       trip a check by quoting it.
              delta  — brace depth moved, counted outside strings.
              """
              code, toks, delta, i, n, in_str = [], [], 0, 0, len(text), False
              while i < n:
                  c = text[i]
                  if in_str:
                      code.append(c)
                      if c == '\\':
                          if i + 1 < n:
                              code.append(text[i + 1])
                              toks.append(' ')
                          toks.append(' ')
                          i += 2
                          continue
                      if c == '"':
                          in_str = False
                          toks.append('"')
                      else:
                          toks.append(' ')
                      i += 1
                      continue
                  if c == '"':
                      in_str = True
                      code.append(c)
                      toks.append(c)
                      i += 1
                      continue
                  if c == '/' and i + 1 < n and text[i + 1] == '/':
                      break
                  if c == '{':
                      delta += 1
                  elif c == '}':
                      delta -= 1
                  code.append(c)
                  toks.append(c)
                  i += 1
              return ''.join(code), ''.join(toks), delta

          def bare_axis_marks(body):
              """Every `AxisMarks` with no content closure after it.

              `AxisMarks(values: .automatic(desiredCount: 3))` draws the
              locale's own labels. One of those beside a labelled sibling
              passes a whole-block search for `AxisValueLabel`, so each
              occurrence is walked past its argument list on its own.
              """
              bare = 0
              for m in re.finditer(r'\bAxisMarks\b', body):
                  j = m.end()
                  while j < len(body) and body[j] in ' \t\n':
                      j += 1
                  if j < len(body) and body[j] == '(':
                      depth = 0
                      while j < len(body):
                          if body[j] == '(':
                              depth += 1
                          elif body[j] == ')':
                              depth -= 1
                              if depth == 0:
                                  j += 1
                                  break
                          j += 1
                      while j < len(body) and body[j] in ' \t\n':
                          j += 1
                  if j >= len(body) or body[j] != '{':
                      bare += 1
              return bare

          problems, unreadable, inspected = [], [], 0

          for path in sorted(pathlib.Path('Agrent').rglob('*.swift')):
              raw = path.read_text(encoding='utf-8').split('\n')
              scanned = [scan(l) for l in raw]
              # Joined, so an `x:` and its `.value` on separate lines still match.
              if not KEY.search('\n'.join(c for c, _t, _d in scanned)):
                  continue

              charts = axes = 0
              for _c, toks, _d in scanned:
                  charts += len(re.findall(r'\bChart\s*[({]', toks))
                  axes += toks.count('.chartXAxis')
              if axes < charts:
                  problems.append('%s: %d Chart(s) over a Date but %d .chartXAxis — '
                                  'a chart with no x axis modifier takes the locale default'
                                  % (path, charts, axes))

              i = 0
              while i < len(raw):
                  toks = scanned[i][1]
                  at = toks.find('.chartXAxis')
                  if at < 0:
                      i += 1
                      continue
                  tail = toks[at:]
                  if '{' in tail:
                      first, region = i, tail[tail.index('{'):]
                  else:
                      # The brace may sit on the next line. `.chartXAxis(.hidden)`
                      # has none and draws no labels, so there is nothing to check.
                      j = i + 1
                      while j < len(raw) and not scanned[j][1].strip():
                          j += 1
                      nxt = scanned[j][1] if j < len(raw) else ''
                      if nxt.strip().startswith('{'):
                          first, region = j, nxt[nxt.index('{'):]
                      else:
                          if '.hidden' not in tail:
                              unreadable.append('%s:%d: %s' % (path, i + 1, raw[i].strip()))
                          i += 1
                          continue

                  block, depth, end = [], 0, None
                  for k in range(first, len(raw)):
                      if k == first:
                          text, d = region, scan(region)[2]
                      else:
                          text, d = scanned[k][1], scanned[k][2]
                      block.append(text)
                      depth += d
                      if depth <= 0:
                          end = k
                          break
                  if end is None:
                      unreadable.append('%s:%d: a .chartXAxis block that never closes'
                                        % (path, first + 1))
                      i += 1
                      continue

                  body = '\n'.join(block)
                  where = '%s:%d-%d' % (path, i + 1, end + 1)
                  if 'AxisMarks' not in body:
                      # Counted as unreadable, NOT inspected. A block that
                      # delegates to a helper must not tick the counter that
                      # proves this step is still guarding something.
                      unreadable.append('%s: a .chartXAxis block with no AxisMarks — '
                                        'it delegates to something this guard cannot follow'
                                        % where)
                      i = end + 1
                      continue

                  inspected += 1
                  bare = bare_axis_marks(body)
                  if bare:
                      problems.append('%s: %d AxisMarks with no content closure, which draws '
                                      'the locale\'s own labels' % (where, bare))
                  elif 'AxisValueLabel' not in body:
                      problems.append('%s: AxisMarks with no AxisValueLabel' % where)
                  elif 'BgDate' not in body:
                      problems.append('%s: an AxisValueLabel that does not go through BgDate'
                                      % where)
                  i = end + 1

          if unreadable:
              print('\n'.join(unreadable))
              print('::error::A .chartXAxis here is in a form this guard cannot read. '
                    'Teach it the form; do not delete the step.')
              sys.exit(1)
          if problems:
              print('\n'.join(problems))
              print('::error::A Date x axis needs AxisValueLabel { Text(BgDate...) }. Without one '
                    'Swift Charts formats from the device locale, and en_BG prints "Sep 14".')
              sys.exit(1)
          if inspected == 0:
              print('::error::0 .chartXAxis blocks inspected. This step is keyed on '
                    'x: .value("Дата") and is no longer guarding anything.')
              sys.exit(1)
          print('%d .chartXAxis block(s) over a Date, every one labelled through BgDate.'
                % inspected)
          GUARD

      # A crop name is server DATA, not a UI label, so nothing that
      # translates labels was ever going to reach it. Eight sites across
      # three screens rendered the server's English at an operator whose
      # app is otherwise entirely Bulgarian, and the owner found it.
      #
      # The failure mode is a NEW render site, not a regression in an old
      # one: someone adds a screen, writes Text(row.commodity), and it is
      # correct-looking English. So any file that touches these fields must
      # also go through CommodityName.
      - name: Commodity names go through CommodityName
        run: |
          bad=""
          for f in $(grep -rl --include='*.swift' -e '\.commodity' -e '\.cropType' Agrent/ \
                       | grep -v 'Agrent/Design/CommodityName.swift'); do
            case "$f" in Agrent/API/*) continue ;; esac
            grep -q 'CommodityName' "$f" || bad="$bad $f"
          done
          if [ -n "$bad" ]; then
            echo "::error::These render a commodity name without CommodityName:$bad"
            exit 1
          fi
          echo "All commodity names go through CommodityName."

      # A colour that MEANS something is a pair, and a pair is only correct
      # when somebody holds the two halves up against each other. Nobody had.
      # One audit found, measured over the composited values:
      #
      #   Color.secondary on a white row     3.44:1   109 sites
      #   Color.orange                       2.20:1    14 sites
      #   Color.green                        2.22:1     3 sites
      #   Color.red                          3.55:1     4 sites
      #   Color.tertiary                     1.73:1     3 sites
      #
      # Every one is Apple's own value behaving as documented, and every one
      # is below the bar in light mode — which is the appearance this app
      # shipped with. They arrived one reasonable-looking line at a time, so
      # the failure mode is a NEW site rather than a regression in an old one:
      # somebody writes `.foregroundStyle(.orange)` for the next warning and
      # it looks exactly like the fourteen that were already there.
      #
      # Palette holds the measured replacements with the numbers beside them.
      # Comment lines are skipped so this can be discussed without tripping,
      # and Palette.swift itself is exempt because it names what it replaced.
      - name: Semantic colours come from Palette
        run: |
          hits=$(grep -rn --include='*.swift' \
                   -e 'foregroundStyle(\.secondary)' \
                   -e 'foregroundStyle(\.tertiary)' \
                   -e 'foregroundStyle(\.orange)' \
                   -e 'foregroundStyle(\.red)' \
                   -e 'foregroundStyle(\.green)' \
                   -e 'Color\.orange' \
                   -e 'background(\.red)' \
                   Agrent/ \
                 | grep -v '^Agrent/Design/Palette.swift:' \
                 | awk '{ l=$0; sub(/^[^:]*:[0-9]+:/, "", l); if (l !~ /^[ \t]*\/\//) print }' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Use Palette.secondaryText / .warning / .error / .success — Palette.swift has the measured ratios."
            exit 1
          fi
          echo "Semantic colours all come from Palette."

      # Palette's VALUES come from agri-saas design/tokens.json, through the
      # generated Tokens.swift vendored by scripts/sync-design-tokens.sh. A
      # hand edit to the vendored copy would fork the app's colours from the
      # web's while both still claimed tokens.json as their source, so its
      # body is hashed against what the script recorded. (VendoredTokensTests
      # checks the same in the test run, with a one-byte-edit control.)
      - name: Vendored design tokens are unmodified
        run: scripts/sync-design-tokens.sh --check

      # A SHEET THAT CANNOT BE NAMED ALOUD IS A SHEET A VOICE USER CANNOT LEAVE.
      #
      # Voice Control's recogniser follows the DEVICE language. This phone
      # reports en_BG, so it listens in English while every button names itself
      # in Bulgarian — visible, correct, unsayable. `A11y.Spoken` carries the
      # nine toolbar verbs with the English a person would actually say, and 29
      # sheet buttons go through it.
      #
      # The reason this is a step and not a convention: the same sweep that
      # added those 29 missed two of them — the send on the insurance form and
      # the cancel on the operation sheet — and the count below is what found
      # them. A design-system helper is an option until something fails when a
      # screen declines to use it.
      #
      # A confirmation or cancellation slot holds one button, so a file needs
      # at least as many input labels as it has slots. Files with MORE are
      # normal: Новини and Тенденции also name their rows.
      - name: Sheet actions can be named aloud
        run: |
          python3 - <<'SPOKEN'
          import pathlib, sys

          slots_total, gaps = 0, []
          for path in sorted(pathlib.Path('Agrent').rglob('*.swift')):
              text = path.read_text(encoding='utf-8')
              slots = (text.count('placement: .confirmationAction')
                       + text.count('placement: .cancellationAction'))
              if not slots:
                  continue
              slots_total += slots
              labels = text.count('accessibilityInputLabels')
              if labels < slots:
                  gaps.append('%s: %d toolbar slot(s), %d input label(s)'
                              % (path, slots, labels))

          if not slots_total:
              print('::error::No confirmationAction/cancellationAction slots found. This '
                    'step is keyed on those placements and is no longer guarding anything.')
              sys.exit(1)
          if gaps:
              print('\n'.join(gaps))
              print('::error::Give each sheet action a name through A11y.Spoken. Voice '
                    'Control listens in the DEVICE language; en_BG cannot say the '
                    'Bulgarian one.')
              sys.exit(1)
          print('%d toolbar slot(s), every file at least as many input labels.' % slots_total)
          SPOKEN

      # The interpunct belongs to ONE view, because it has to disappear.
      #
      # Five screens build a subtitle as `Text(crop) · Text(area)`. At the
      # accessibility sizes that line has to stack, and when it does the
      # separator becomes a row containing a single dot — so `MetaSeparator`
      # renders nothing there, and every one of those rows has to go through it.
      #
      # The Dynamic Type pass fixed THREE of the five, which is the whole
      # reason this step exists. `MetaRow` and `MetaSeparator` were written to
      # stop the fix being applied per-screen, and then the sweep was applied
      # per-screen anyway: Задачи, Дневник and Админ were the rows on screen at
      # the time, and Локации, the parcel list under a location map and the
      # parcel picker kept a plain `HStack`. A screenshot at AX5 found it —
      # «Пшени / ца · 324,78 / дка», a name broken mid-word with the dot
      # still drawn beside it. Nobody would have found it by reading.
      #
      # It is also the character `.combine` reads aloud as "middle dot", which
      # is why these rows all build their spoken label from the values.
      - name: The interpunct comes from MetaSeparator
        run: |
          hits=$(grep -rn --include='*.swift' -F 'Text("·")' Agrent/ \
                 | grep -v '^Agrent/Design/AdaptiveRows.swift:' \
                 | awk '{ l=$0; sub(/^[^:]*:[0-9]+:/, "", l); if (l !~ /^[ \t]*\/\//) print }' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Use MetaRow { … MetaSeparator() … }. A literal separator cannot"
            echo "::error::disappear when the row stacks at the accessibility sizes."
            exit 1
          fi
          echo "The interpunct is only in MetaSeparator."

      # FARM PATHS COME FROM `FarmPath` (agrent-ios#192, P4.3).
      #
      # `Config.tenantSlug` fell back to the farm the app was pinned to when
      # no farm was open, so a request built in that state went to a farm the
      # person never chose. It is gone: a farm path is built from the open
      # farm or from none, and `APIClient` refuses one with none. This keeps
      # the doors shut — the old name; a `"/api/t/` literal anywhere but the
      # one builder; and the pinned farm's name outside the four files that
      # keep it for a migration and the fixture world, since
      # `openSlug ?? Config.pinnedFarmSlug` would bring the fallback back
      # without either of the others noticing. Comment lines are skipped.
      - name: Farm paths come from FarmPath
        run: |
          code() { awk '{ l=$0; sub(/^[^:]*:[0-9]+:/, "", l); if (l !~ /^[ \t]*\/\//) print }'; }
          old=$(grep -rn --include='*.swift' -F 'Config.tenantSlug' Agrent/ | code || true)
          literal=$(grep -rn --include='*.swift' -F '"/api/t/' Agrent/ \
                    | grep -v '^Agrent/API/FarmPath.swift:' | code || true)
          pinned=$(grep -rn --include='*.swift' -F 'pinnedFarmSlug' Agrent/ \
                   | grep -v -e '^Agrent/Config.swift:' -e '^Agrent/Core/ActiveFarm.swift:' \
                             -e '^Agrent/Core/PendingOperations.swift:' \
                             -e '^Agrent/Debug/FixtureCatalogue.swift:' | code || true)
          if [ -n "$old$literal$pinned" ]; then
            [ -n "$old" ] && echo "$old"
            [ -n "$literal" ] && echo "$literal"
            [ -n "$pinned" ] && echo "$pinned"
            echo "::error::Build farm paths from FarmPath.root, or FarmPath.root(for:) for a queued"
            echo "::error::record's own farm. A literal or a fallback can put another farm in a path."
            exit 1
          fi
          echo "Every farm path starts at FarmPath."

      # THE COST OF SPELLING THE SCHEMES OUT, paid back.
      #
      # `project.yml` had no `schemes:` block until the UI test target arrived,
      # so Xcode auto-created one scheme and folded EVERY test bundle that
      # depends on the app into its test action. That is why the block exists:
      # left implicit, `AgrentA11yShots` would have joined the run above and
      # failed there for a reason unrelated to the code, because a runner's
      # simulator has an empty Keychain and the app opens on SignInView.
      #
      # But a hardcoded list trades a silent inclusion for a silent EXCLUSION.
      # The next unit-test target somebody adds will not run in CI, and nothing
      # will say so — the test count simply stays where it was, which looks
      # exactly like a branch that added no tests.
      #
      # So the two are held against each other. Any target typed
      # `bundle.unit-testing` must appear in the `Agrent` scheme's test targets.
      # UI test targets are deliberately NOT required: keeping them out is the
      # whole point of the block.
      - name: Every unit test target runs in CI
        run: |
          python3 - <<'SCHEMES'
          import pathlib, re, sys

          lines = pathlib.Path('project.yml').read_text(encoding='utf-8').split('\n')

          # A deliberately small parser rather than a yaml import: the guards
          # job has no pyyaml, and adding a dependency to check a two-section
          # file is a worse trade than reading its two sections.
          section = name = None
          blocks = {}
          for line in lines:
              if line[:1] not in (' ', '') :
                  section, name = line.split(':')[0], None
                  continue
              head = re.match(r'^  ([A-Za-z0-9_.-]+):\s*$', line)
              if head:
                  name = head.group(1)
                  blocks[(section, name)] = []
                  continue
              if name is not None:
                  blocks[(section, name)].append(line)

          # Both spellings: XcodeGen takes `bundle.unit-test` and
          # `bundle.unit-testing` as the same type, and this file uses the
          # first. Keying on the second alone made the tripwire below fire on
          # a clean tree, which is how that error was found rather than
          # shipped as a guard of nothing.
          UNIT = re.compile(r'type:\s*bundle\.unit-test(ing)?\s*$')
          unit = {n for (sec, n), body in blocks.items()
                  if sec == 'targets' and any(UNIT.search(l) for l in body)}

          wired, in_test, in_targets = set(), False, False
          for line in blocks.get(('schemes', 'Agrent'), []):
              if re.match(r'^    [A-Za-z]', line):
                  in_test = line.strip() == 'test:'
                  in_targets = False
                  continue
              if in_test and line.strip() == 'targets:':
                  in_targets = True
                  continue
              if in_targets:
                  item = re.match(r'^\s*-\s*([A-Za-z0-9_.-]+)\s*$', line)
                  if item:
                      wired.add(item.group(1))
                  elif line.strip():
                      in_targets = False

          if not unit:
              print('::error::No bundle.unit-test target found in project.yml. '
                    'This guard is keyed on that type and is no longer guarding anything.')
              sys.exit(1)
          missing = sorted(unit - wired)
          if missing:
              print('::error::These unit test targets are not in the Agrent scheme, '
                    'so CI never runs them: %s' % ', '.join(missing))
              sys.exit(1)
          print('Unit test targets in CI: %s' % ', '.join(sorted(unit)))
          SCHEMES

      # THE SEAM THAT LETS A UI TEST PAST SIGN-IN, HELD TO ITS TERMS.
      #
      # `Agrent/Debug/UITestSeam.swift` makes the app open on `MainTabView`
      # and serves every request from `Tests/Fixtures` when it is launched
      # with `AGRENT_UITEST_FIXTURES`. That is a switch in the auth path of a
      # real farm's app, so it carries three conditions, and this step is
      # where each one is checked against the tree rather than against a
      # sentence in a review:
      #
      #   1. every line of `Agrent/Debug` is inside `#if DEBUG`;
      #   2. nothing outside that directory names a seam type except inside
      #      `#if DEBUG` — that is the line by which the seam would leak into
      #      code that ships;
      #   3. `isActive` is read from the argument vector and from nothing
      #      else, so being a debug build cannot switch it on by itself.
      #
      # This step is SOURCE analysis and is the cheap half. The half that
      # cannot be fooled is "The UI test seam cannot reach Release" in the
      # build job, which reads the produced Release binary. Both, because a
      # `#if` and a build setting fail differently and neither implies the
      # other.
      - name: The UI test seam is DEBUG-only
        run: |
          python3 - <<'SEAM'
          import pathlib, re, sys

          SEAM_DIR = pathlib.Path('Agrent/Debug')
          # Every type the seam is made of. Spelled out, so renaming one
          # without teaching this step trips the tripwire below rather than
          # quietly emptying the search.
          SYMBOLS = ['UITestSeam', 'FixtureURLProtocol', 'FixtureCatalogue']
          NAMED = re.compile(r'\b(%s)\b' % '|'.join(SYMBOLS))

          def walk(lines):
              """(lineno, text, inside_debug) per line.

              A stack, not a counter: `#if DEBUG` nested inside `#if os(iOS)`
              is still guarded, and the `#else` of a `#if DEBUG` is NOT — a
              counter would call both of those the same thing.
              """
              stack = []
              for n, raw in enumerate(lines, 1):
                  text = raw.strip()
                  if text.startswith('#if'):
                      stack.append(text[3:].strip() == 'DEBUG')
                  elif text.startswith('#elseif'):
                      if stack:
                          stack[-1] = text[7:].strip() == 'DEBUG'
                  elif text.startswith('#else'):
                      if stack:
                          stack[-1] = False
                  elif text.startswith('#endif'):
                      if stack:
                          stack.pop()
                  else:
                      yield n, raw, any(stack)
                      continue
                  yield n, raw, False

          def is_skippable(raw):
              text = raw.strip()
              return not text or text.startswith('//')

          problems = []

          # ── 1. the seam's own files ──
          seam_files = sorted(SEAM_DIR.rglob('*.swift'))
          if not seam_files:
              print('::error::No .swift under Agrent/Debug. This step is keyed on that '
                    'directory and is no longer guarding anything. If the seam moved, '
                    'move this step with it.')
              sys.exit(1)

          for path in seam_files:
              lines = path.read_text(encoding='utf-8').split('\n')
              for n, raw, inside in walk(lines):
                  if is_skippable(raw) or raw.strip().startswith('#'):
                      continue
                  if not inside:
                      problems.append('%s:%d: outside #if DEBUG — %s'
                                      % (path, n, raw.strip()[:70]))
                      break

          # ── 2. every reference from the rest of the app ──
          wired = 0
          for path in sorted(pathlib.Path('Agrent').rglob('*.swift')):
              if SEAM_DIR in path.parents:
                  continue
              lines = path.read_text(encoding='utf-8').split('\n')
              for n, raw, inside in walk(lines):
                  if is_skippable(raw) or not NAMED.search(raw):
                      continue
                  if inside:
                      wired += 1
                  else:
                      problems.append('%s:%d: names the seam outside #if DEBUG — %s'
                                      % (path, n, raw.strip()[:70]))

          # ── 3. the switch is the launch argument and nothing else ──
          seam_src = (SEAM_DIR / 'UITestSeam.swift').read_text(encoding='utf-8')
          if not re.search(
              # ANCHORED AT BOTH ENDS. A prefix match accepts
              # `… .contains(launchArgument) || somethingElse`, which is the
              # one edit that would matter: it is how a seam stops being
              # switched on by the argument and nothing else.
              r'isActive\s*:\s*Bool\s*=\s*\n?\s*'
              r'ProcessInfo\.processInfo\.arguments'
              r'\.contains\(launchArgument\)\s*\n', seam_src):
              problems.append(
                  'UITestSeam.isActive is no longer `ProcessInfo.processInfo.arguments'
                  '.contains(launchArgument)`. An explicit argument is the whole '
                  'condition the owner agreed to; being a debug build must not be enough.')
          argument = re.search(r'launchArgument\s*=\s*"([^"]+)"', seam_src)
          if not argument:
              problems.append('UITestSeam.launchArgument is not a string literal, so '
                              'the Release check cannot look for it in the binary.')
          elif argument.group(1).startswith('-'):
              problems.append('The launch argument starts with "-", so UserDefaults will '
                              'read it into NSArgumentDomain as a preference key.')

          # ── 4. Release strikes the whole directory out of the build ──
          spec = pathlib.Path('project.yml').read_text(encoding='utf-8')
          # UNDER `Release:`, not merely somewhere in the file. Searching the
          # whole spec accepts the setting under Debug, under another target,
          # or in a comment — all of which leave Release carrying the seam
          # while the step reports that it does not.
          excluded = None
          release_indent = None
          for line in spec.split('\n'):
              stripped = line.strip()
              indent = len(line) - len(line.lstrip())
              if release_indent is not None and stripped and indent <= release_indent:
                  release_indent = None          # the Release block ended
              if stripped == 'Release:':
                  release_indent = indent
                  continue
              if release_indent is None or stripped.startswith('#'):
                  continue
              found = re.match(r'EXCLUDED_SOURCE_FILE_NAMES:\s*"([^"]*)"', stripped)
              if found:
                  excluded = found.group(1)

          for needed in ('Agrent/Debug/*', 'Tests/Fixtures/*'):
              if excluded is None or needed not in excluded:
                  problems.append('project.yml does not exclude %s from Release via '
                                  'EXCLUDED_SOURCE_FILE_NAMES, under a `Release:` key.'
                                  % needed)

          # ── the tripwires ──
          for symbol, declaration in (
              ('UITestSeam', 'enum UITestSeam'),
              ('FixtureURLProtocol', 'class FixtureURLProtocol'),
              ('FixtureCatalogue', 'enum FixtureCatalogue'),
          ):
              if not any(declaration in p.read_text(encoding='utf-8') for p in seam_files):
                  print('::error::`%s` is not declared under Agrent/Debug. This step '
                        'searches for that name; teach it the new one rather than '
                        'letting it search for nothing.' % declaration)
                  sys.exit(1)
          if wired == 0:
              print('::error::Nothing outside Agrent/Debug names the seam. Either the '
                    'wiring in AgrentApp/APIClient is gone — in which case the seam does '
                    'nothing — or this step has stopped being able to see it.')
              sys.exit(1)

          if problems:
              print('\n'.join(problems))
              print('::error::The UI test seam must be unreachable in Release and must '
                    'require its launch argument. See Agrent/Debug/UITestSeam.swift.')
              sys.exit(1)
          print('Seam files: %d, all inside #if DEBUG. References from the app: %d, all '
                'inside #if DEBUG. Release excludes Agrent/Debug/* and Tests/Fixtures/*.'
                % (len(seam_files), wired))
          SEAM

      # Agrent.xcodeproj and Agrent/Info.plist are DERIVED from project.yml and
      # gitignored. Committing either reintroduces the conflict-prone pbxproj
      # the spec exists to avoid, and lets the two drift apart.
      - name: Generated files stay out of git
        run: |
          for path in "Agrent.xcodeproj" "Agrent/Info.plist"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked but is generated from project.yml."
              exit 1
            fi
          done
          echo "Generated files are untracked, as intended."

  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the newest Xcode the image carries, and NOT left to the
      # image default — GitHub's macOS runners ship several Xcodes under
      # /Applications/Xcode_<version>.app and the default is not always the
      # newest. CI building on a different toolchain than the developer is a
      # particular kind of lie: green here would stop meaning green there.
      #
      # DEVELOPER_DIR is set explicitly rather than inherited. On the
      # developer's machine `xcode-select -p` points at CommandLineTools, so
      # every local build already overrides it; inheriting a default that was
      # wrong locally is not a habit worth carrying into CI.
      #
      # Developer toolchain as of 2026-09-21: Xcode 26.6 (17F113),
      # macOS 26.5.1, iOS Simulator SDK 26.5.
      - name: Select Xcode
        run: |
          echo "Xcodes on this image:"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$NEWEST" ] || NEWEST=/Applications/Xcode.app
          echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected: $NEWEST"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          xcrun simctl list runtimes | grep -i ios || true
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          echo "Xcode major: $MAJOR (developer builds on 26)"
          if [ "$MAJOR" != "26" ]; then
            echo "::warning::CI is on Xcode $MAJOR; the developer builds on 26. \
          Green here does not fully imply green there."
          fi
          {
            echo "### Toolchain"
            echo ""
            echo '```'
            xcodebuild -version
            echo "xcodegen $(xcodegen --version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The project is not committed; CI must build it the same way a developer
      # does, from project.yml.
      - name: Generate the project
        run: xcodegen generate

      # This step exists because the failure it catches is SILENT. A missing
      # CFBundleURLSchemes still builds and still runs — it breaks only at
      # sign-in, when the OAuth callback has nowhere to land, which is a much
      # more confusing thing to debug later.
      #
      # Note the -A6: an earlier version of this check used -A3 and stopped one
      # line short of the value, so a plist with a correct URLName and NO
      # scheme passed it. It asserts the value now, not the neighbourhood.
      - name: Verify the callback URL scheme survived generation
        run: |
          plutil -p Agrent/Info.plist | grep -A6 CFBundleURLTypes
          plutil -p Agrent/Info.plist \
            | grep -A6 CFBundleURLTypes \
            | grep -A2 CFBundleURLSchemes \
            | grep -q '"bg.agrent.app"' \
            || { echo "::error::CFBundleURLSchemes is missing bg.agrent.app"; exit 1; }

      # Runner images change their Xcode and simulator sets without warning, so
      # the destination is resolved rather than hardcoded. A pinned
      # "iPhone 17 Pro" would turn an image update into a red build that has
      # nothing to do with the code.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(.github/scripts/pick-simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Agrent.xcodeproj \
            -scheme Agrent \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            | tee xcodebuild.log \
            | grep -E "error:|warning:|Executed [0-9]+ test|\*\* (TEST|BUILD)" \
            || { echo "::error::xcodebuild test failed"; tail -60 xcodebuild.log; exit 1; }

      # A COUNT NOBODY SEES IS A COUNT NOBODY CHECKS. Printed into the job
      # summary, where a human actually looks, rather than left buried in
      # thousands of lines of xcodebuild output. A suite can silently collect
      # the wrong set — or stop collecting most of it — and a green tick looks
      # identical either way; the denominator is the only thing that shows it.
      - name: Report test count
        if: always()
        run: |
          LINE=$(grep -oE "Executed [0-9]+ tests?, with [0-9]+ failures?" xcodebuild.log | tail -1)
          COUNT=$(echo "$LINE" | grep -oE "^Executed [0-9]+" | grep -oE "[0-9]+")
          FAILURES=$(echo "$LINE" | grep -oE "with [0-9]+ failure" | grep -oE "[0-9]+")
          : "${COUNT:=0}"; : "${FAILURES:=0}"
          echo "::notice title=Tests::${COUNT} executed, ${FAILURES} failed"
          {
            echo "### Tests"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Executed | **${COUNT}** |"
            echo "| Failed | ${FAILURES} |"
            echo ""
            grep -oE "Test Suite '[A-Za-z]+Tests?'.*(passed|failed)" xcodebuild.log | sort -u || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Zero tests executed — a suite that collects nothing is green for the wrong reason."
            exit 1
          fi

      # SOURCE warnings only — file:line:col — because that is what "no new
      # warnings" is actually about. Build-tool chatter is reported but does
      # not gate: the AppIntents processor emits
      # "Metadata extraction skipped. No AppIntents.framework dependency
      # found." on every build, which says nothing about the code.
      #
      # The first CI run failed here, and the bug was in the LOCAL checking,
      # not in CI. Every by-hand warning count this session used
      # `grep "warning: [a-z].*"` — lowercase initial — which silently
      # excluded that capital-M line. So the local number was 2 and the honest
      # number was 3, for the whole session, and nothing noticed until
      # something counted it differently.
      #
      # Both numbers are printed for exactly that reason: a single total hides
      # which kind moved.
      - name: No new warnings
        run: |
          SOURCE=$(grep -oE "[A-Za-z0-9_+/.-]+\.swift:[0-9]+:[0-9]+: warning: .*" xcodebuild.log \
            | sed -E 's/.*(warning: .*)/\1/' | sed 's/[[:space:]]*$//' | sort -u)
          SOURCE_COUNT=$(printf '%s' "$SOURCE" | grep -c . || true)
          TOOLING=$(grep -oE "warning: .*" xcodebuild.log | sed 's/[[:space:]]*$//' | sort -u \
            | grep -vF "$(printf '%s' "$SOURCE")" || true)

          echo "Source warnings: $SOURCE_COUNT"
          printf '%s\n' "$SOURCE"
          {
            echo "### Warnings"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source (gated) | **$SOURCE_COUNT** / 2 allowed |"
            echo ""
            [ -n "$SOURCE" ] && printf '%s\n' "$SOURCE" | sed 's/^/- /'
            if [ -n "$TOOLING" ]; then
              echo ""
              echo "Build-tool notices, not gated:"
              printf '%s\n' "$TOOLING" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SOURCE_COUNT" -gt 2 ]; then
            echo "::error::$SOURCE_COUNT source warnings; 2 are known (ISO8601DateFormatter Sendable)."
            exit 1
          fi

      # THE HALF THAT READS THE BINARY.
      #
      # "The UI test seam is DEBUG-only" in the guards job reads the source.
      # Source is where the mistake is made and it is not where the guarantee
      # lives: a `#if DEBUG` is only as good as which configurations define
      # DEBUG, and `EXCLUDED_SOURCE_FILE_NAMES` is only as good as the paths
      # it names. So this builds Release and looks in the product.
      #
      # ── The scan proves itself in the same run ──
      #
      # A search for three symbols that finds none of them is the shape every
      # guard in this file was written against: it reports that it passed
      # whether or not it can see anything. So the identical scan runs over
      # the DEBUG product the test step just built, where all three symbols,
      # the launch-argument literal and the fixture payloads must ALL be
      # found. Release must then show none of them. Two directions, one scan,
      # every run.
      #
      # ── Why every Mach-O and not just the executable ──
      #
      # Xcode 26 splits a Debug build: the app's own code goes into
      # `Agrent.debug.dylib` (13.2 MB measured locally) and the file named
      # `Agrent` is a 58 KB stub. A scan of the executable alone would find
      # nothing in Debug — and would then be reporting that the control
      # passed when it had looked at the wrong file.
      #
      # ── iOS Simulator, not a device ──
      #
      # `generic/platform=iOS Simulator` needs no signing team, and the
      # signing team is deliberately not committed (project.yml). What is
      # being asked is which SOURCE FILES the Release configuration compiles
      # and which resources it copies; that is decided by the configuration,
      # not by the platform.
      - name: The UI test seam cannot reach Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project Agrent.xcodeproj \
            -scheme Agrent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/release-dd" \
            | tee release.log \
            | grep -E "error:|\*\* BUILD" \
            || { echo "::error::the Release build failed"; tail -60 release.log; exit 1; }

          # The Debug product is wherever the test step above put it — that
          # step uses the default derived data, and asking xcodebuild beats
          # guessing the hashed directory name.
          DEBUG_APP=$(xcodebuild -project Agrent.xcodeproj -scheme Agrent \
                        -configuration Debug \
                        -destination "id=${{ steps.sim.outputs.udid }}" \
                        -showBuildSettings 2>/dev/null \
                      | sed -n 's/^ *BUILT_PRODUCTS_DIR = //p' | head -1)/Agrent.app
          RELEASE_APP="$RUNNER_TEMP/release-dd/Build/Products/Release-iphonesimulator/Agrent.app"

          # The scan is a file, not a heredoc, because testflight.yml runs the
          # identical one over the archive that is about to be uploaded. One
          # scan, two callers — two copies would drift, and the one that drifted
          # could be the one in front of TestFlight.
          python3 .github/scripts/seam-scan.py "$RELEASE_APP" "$DEBUG_APP"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          retention-days: 7
